name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history, not the default shallow clone (RD-099).
          #
          # `spec_status.py` embeds each spec's git "last touched" date, so the report
          # it generates is a function of the history available. At depth 1 there is no
          # history: every date comes out wrong, the regenerated report never matches
          # the committed one, and `--check` fails with STALE on a tree that is
          # perfectly in sync. Green locally, red in CI, for a reason no amount of
          # regenerating could fix.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The three repo guards, before the tests: a stale registry or an asset that
      # slipped in is cheaper to catch here than after a review (RD-001, RD-002).
      - run: pnpm check

      - run: pnpm typecheck
      - run: pnpm test
