name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The three repo guards, before the tests: a stale registry or an asset that
      # slipped in is cheaper to catch here than after a review (RD-001, RD-002).
      - run: pnpm check

      - run: pnpm typecheck
      - run: pnpm test
